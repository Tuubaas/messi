packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd
# Versions shared by several workspace packages.
catalog:
  effect: ^4.1.4
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
