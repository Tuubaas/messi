name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp test
      - run: pnpm exec wrangler types --check
        working-directory: apps/home
      - run: pnpm exec wrangler types --check
        working-directory: apps/games
      - run: pnpm exec wrangler types --check
        working-directory: apps/finance
      - run: vp run -r build
      - name: Homepage ships no JavaScript
        run: |
          if grep -q "<script" apps/home/dist/client/index.html; then
            echo "apps/home/dist/client/index.html contains a <script> tag (decision 0005)."
            exit 1
          fi
