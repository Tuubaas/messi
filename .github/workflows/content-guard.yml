name: Content guard

# apps/*/content/ holds the owner's own words (decision 0001). Owner edits go straight to main
# through the editor; a PR may only change content when the owner labels it `content-approved`.
# Runs on label changes too: a run only sees the labels from its own event, so re-running an
# older run never picks up a newly added label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: content-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Block content changes without owner approval
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'content-approved') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- ':(glob)apps/*/content/**')
          if [ -n "$changed" ] && [ "$APPROVED" != "true" ]; then
            echo "This PR changes owner content without the 'content-approved' label:"
            echo "$changed"
            exit 1
          fi
